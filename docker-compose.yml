version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: placement-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: placement_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: placement-redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: placement-backend
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    env_file:
      - ./backend/.env

volumes:
  pgdata:
