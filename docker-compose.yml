services:
  postgres:
    image: postgres:15
    container_name: placement-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: placement_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d placement_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: placement-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: placement-backend
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Inside the compose network the services are reached by name, not localhost.
      DATABASE_URL: postgresql://admin:secret@postgres:5432/placement_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret}
      CORS_ORIGINS: http://localhost:5173

volumes:
  pgdata:
