# Weekly dependency update PRs. Minor/patch bumps are grouped into one PR per
# folder so CI validates them together and the PR list stays manageable.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only; TS 7 breaks `npm ci`.
      # Remove once typescript-eslint's peer range includes newer versions.
      - dependency-name: typescript
        versions: [">=6.1.0"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
