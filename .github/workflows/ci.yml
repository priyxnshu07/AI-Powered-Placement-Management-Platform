name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# A new push to the same branch/PR cancels the now-outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  backend:
    name: Backend · tests (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    # Real databases as sidecar containers, so integration tests exercise
    # actual unique constraints, transactions and Redis TTLs, not mocks.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: placement_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U admin -d placement_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run unit + integration tests
        run: npm test -- --ci
        env:
          TEST_DATABASE_URL: postgresql://admin:secret@localhost:5432/placement_test
          TEST_REDIS_URL: redis://localhost:6379

  frontend:
    name: Frontend · lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build
        env:
          VITE_API_URL: https://api.example.invalid/api

  docker:
    name: Docker · build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: placement_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U admin -d placement_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: backend
          tags: placement-backend:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boots the exact image that would be deployed and checks it serves
      # traffic: catches a broken Dockerfile, missing prod dependency or bad CMD.
      - name: Smoke test the container
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql://admin:secret@localhost:5432/placement_db \
            -e JWT_SECRET=ci-smoke-test \
            -e PORT=3000 \
            placement-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then echo; echo "Container is healthy"; exit 0; fi
            sleep 2
          done
          echo "Container never became healthy"; docker logs api; exit 1
